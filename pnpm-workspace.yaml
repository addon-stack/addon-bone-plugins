packages:
  - packages/@adnbn/*
  - tests/fixtures/*

overrides:
  # Nx pins 7.29.0; 7.30.1 fixes GHSA-xjj6-f33q-929c and retains the earlier security fixes.
  # Remove when Nx requires a patched version.
  "nx>undici@7.29.0": "7.30.1"
  # Nx 23.2.1 pins 1.6.1. Remove when Nx requires a version fixed for GHSA-7w5x-hrqm-74c2.
  "nx>smol-toml@<=1.7.0": "1.9.0"

allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  adnbn: true
  nx: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@addon-core/browser@0.8.0"
  - "@addon-core/inject-css@0.4.0"
  - adnbn@0.16.1
